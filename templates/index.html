<body>

    <h1>🤖 大學新鮮人的AI小助手</h1>

        嗨！我是第一次來到校園的AI小助手。
    </p>

	<script>

	let answered = false;

function startGame() {

   document.getElementById("game").innerHTML =

    "<button onclick='chooseC()'>🛠️ C：先自己找找看</button>" +

"<p id='answer'></p>" +
"<hr>";
}
	
function chooseA() {

        "<br><br><button onclick='level2()'>前往第二關 ➜</button>";

    }
}

function chooseB() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =
        "🤖 好方法！遇到不知道的事情，我也可以主動詢問別人。" +
        "<br><br><button onclick='level2()'>前往第二關 ➜</button>";

        answered = true;
    }
}

function chooseC() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =
        "🤖 好方法！我可以先試著找找看，如果走錯了，再調整方向。" +
        "<br><br><button onclick='level2()'>前往第二關 ➜</button>";

    }
}

function level2() {

    answered = false;

    document.getElementById("game").innerHTML =
        "<h2>第二關：教室找到了！</h2>" +
        "<p>🤖 到了教室，有點社恐的我，接下來該怎麼做。</p>" +
        "<p>你會建議我怎麼做？</p>" +

        "<button onclick='level2A()'>🔎 A：隨機找個位置坐下</button> " +
        "<button onclick='level2B()'>💬 B：開心的跟同學打招呼</button> " +
        "<button onclick='level2C()'>🛠️ C：熟悉環境，四處觀察</button>" +

        "<p id='answer'></p>" +
        "<hr>";
     
}

function level2A() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =
            "🤖 還行，看看書，看看手機，做自己熟悉的事。" +
            "<br><br><button onclick='level3()'>前往第三關 ➜</button>";

        answered = true;
    }
}

function level2B() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =
            "🤖 做的好，勇於突破自己，值得鼓勵。" +
            "<br><br><button onclick='level3()'>前往第三關 ➜</button>";

            "<br><br><button onclick='level3()'>前往第三關 ➜</button>";

    "<h2>第三關：第一次分組報告！</h2>" +
    "<p>🤖 上課後，老師突然宣布要做分組報告，但我跟組員都不太熟，也不知道工作要怎麼分。</p>" +

    "<hr>";
}

function level3A() {

        document.getElementById("answer").innerHTML =
        "🤖 一個人全部做可能會很累，而且也失去了和組員合作的機會。" +
        "<br><br><button onclick='level4()'>前往第四關 ➜</button>";

}


function level3B() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =
        "🤖 好主意！先和組員討論，了解大家擅長什麼，再一起分配工作會比較有效率。" +

    "<p>🤖 分組報告做到一半，我負責整理資料，但是有些內容我看不懂，不知道該怎麼繼續。</p>" +

    "<button onclick='level4C()'>🛠️ C：看不懂就先跳過，不處理</button>" +

}

function level4A() {

        answered = true;
    }
}


function level4B() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =

        "<br><br><button onclick='level5()'>前往第五關 ➜</button>";

        answered = true;
    }
}


function level4C() {

    if (answered == false) {

        document.getElementById("answer").innerHTML =
        "🤖先做其他部分可以讓工作繼續，但看不懂的內容最後還是要回來處理。我可以先記下問題，再找同學、老師或 AI 幫忙。" +
        "<br><br><button onclick='level5()'>前往第五關 ➜</button>";

        answered = true;
    }
}

function level5() {

    answered = false;

    document.getElementById("game").innerHTML =
    "<h2>第五關：完成第一天的挑戰！</h2>" +

    "<p>🤖 今天遇到了迷路、不熟悉環境、分組合作和看不懂資料的問題。</p>" +

    "<p>一開始很多事情我都不知道該怎麼做，但我發現，遇到問題不一定要馬上知道答案。</p>" +

    "<p>我可以先觀察、詢問別人，也可以利用 AI 幫忙整理資訊，再自己判斷。</p>" +

    "<p><b>重要的不是每次都選到最好的方法，而是遇到問題時，願意想辦法把它解決。</b></p>" +

    "<h2>🎉 恭喜你！完成大學新鮮人的第一天！</h2>" +

    "<button onclick='startGame()'>🔄 再玩一次</button>" +

    "<hr>";
}


</script>

<hr>

<h2>🤖 AI 小助手自由問答區</h2>

<p>有什麼大學生活的問題，都可以問我！</p>

<input
    type="text"
    id="question"
    placeholder="例如：大學第一天怎麼交朋友？"
    size="40"
    maxlength="500"
>

<button onclick="askAI()">詢問 AI</button>

<p id="aiAnswer"></p>

<script>
async function askAI() {

    // 取得使用者輸入的問題
    const question =
        document.getElementById("question").value;

    // 找到顯示 AI 回答的位置
    const answerBox =
        document.getElementById("aiAnswer");

    // 檢查是否輸入問題
    if (!question.trim()) {
        answerBox.textContent = "請先輸入問題！";
        return;
    }

    // 顯示等待訊息
    answerBox.textContent = "🤖 AI 正在思考中...";

    try {
        // 把問題傳送給 Python
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        // 接收 Python 傳回的資料
        const data = await response.json();

        // 顯示 AI 回答
        answerBox.textContent = response.ok
            ? "🤖 " + data.answer
            : "發生問題：" + data.error;

    } catch (error) {
        answerBox.textContent =
            "目前無法連接 AI 服務。";
    }
}
</script>


</body>

</html>
